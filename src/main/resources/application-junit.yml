#========================================
# Test profile settings (junit tests)
#========================================
logging:
  level:
    root: INFO
scheduler:
  cleanup:
    cron: "-"
spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.6.22:///
  flyway:
    enabled: true
  jpa:
    properties:
      hibernate:
        format_sql: true
