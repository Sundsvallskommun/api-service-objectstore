#========================================
# General settings
#========================================
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
server:
  tomcat:
    # Tomcat discards at most this much of a request body it has decided not to read. An upload refused with a 413 or a
    # 412 before its body is read reaches the client as a connection reset unless the whole of it can be discarded, so
    # this tracks the object size limit rather than being set on its own.
    max-swallow-size: ${storage.max-object-size}
scheduler:
  cleanup:
    name: cleanup
    cron: "0 0 3 * * *"
    lock-at-most-for: PT10M
    maximum-execution-time: PT5M
spring:
  application:
    name: objectstore
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
storage:
  default-time-to-live: P7D
  # Kept under the 16MB max_allowed_packet a MariaDB server ships with, since an object travels to the database as a
  # single statement. Raising this means raising max_allowed_packet on the server to match.
  max-object-size: 15MB
