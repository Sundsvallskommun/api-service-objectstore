#========================================
# Test profile settings (IT tests)
#========================================
logging:
  level:
    root: INFO
scheduler:
  cleanup:
    cron: "-"
spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.6.22:///
  flyway:
    enabled: true
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: validate
